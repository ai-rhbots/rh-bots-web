{% extends "base.html" %}
{% block titulo %}Acceso{% endblock %}
{% block contenido %}
<div class="acceso">
  <h1>RH<span>·</span>BOTS <em>panel</em></h1>
  {% if error %}<p class="aviso aviso--error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="u">Usuario</label>
    <input id="u" name="usuario" autocomplete="username" required autofocus>
    <label for="c">Contraseña</label>
    <input id="c" name="clave" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
